spring.application.name=ServiceDiscovery
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8761}

# A standalone registry does not register with or fetch from itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# Faster eviction of dead instances in non-prod; tune for production
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.springframework=INFO
