spring.application.name=OrderProcessor
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8082}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=INFO

# JWT validation (must match UserManagement issuer + secret)
security.jwt.secret=${JWT_SECRET:local-dev-only-insecure-secret-change-me-32bytes-min}
security.jwt.issuer=${JWT_ISSUER:user-management}

# Downstream ProductCatalog (synchronous snapshot + reservation calls)
order.product-catalog.base-url=${PRODUCT_CATALOG_URL:http://localhost:8080}
order.product-catalog.connect-timeout-ms=${PRODUCT_CATALOG_CONNECT_TIMEOUT_MS:2000}
order.product-catalog.read-timeout-ms=${PRODUCT_CATALOG_READ_TIMEOUT_MS:3000}

# Single-currency MVP pricing (fixed/zero adjustments)
order.pricing.currency=${ORDER_CURRENCY:INR}
order.pricing.tax-amount=${ORDER_TAX_AMOUNT:0.00}
order.pricing.shipping-amount=${ORDER_SHIPPING_AMOUNT:0.00}
order.pricing.discount-amount=${ORDER_DISCOUNT_AMOUNT:0.00}

# Idempotency record retention
order.idempotency.retention-hours=${ORDER_IDEMPOTENCY_RETENTION_HOURS:24}

# Kafka (shared serializers; bootstrap set per profile)
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

# Topic + relay wiring
order.kafka.order-events-topic=${ORDER_EVENTS_TOPIC:order-events}
order.kafka.payment-events-topic=${PAYMENT_EVENTS_TOPIC:payment-events}
order.kafka.consumer-enabled=${ORDER_KAFKA_CONSUMER_ENABLED:true}
order.kafka.topics-enabled=${ORDER_KAFKA_TOPICS_ENABLED:true}
order.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
order.outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_MS:2000}
order.outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
order.outbox.relay.max-retries=${OUTBOX_RELAY_MAX_RETRIES:10}
