spring.datasource.url=jdbc:h2:mem:orderprocessor_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
order.product-catalog.base-url=http://localhost:0
security.jwt.secret=test-only-insecure-secret-change-me-32bytes-minimum
security.jwt.issuer=user-management
