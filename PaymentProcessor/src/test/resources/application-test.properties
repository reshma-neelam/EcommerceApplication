spring.datasource.url=jdbc:h2:mem:paymentprocessor_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
payment.order.base-url=http://localhost:0
security.jwt.secret=test-only-insecure-secret-change-me-32bytes-minimum
security.jwt.issuer=user-management
payment.stripe.secret-key=sk_test_dummy
payment.stripe.webhook-secret=whsec_test_dummy
payment.currency=INR
# Disable Kafka broker interaction for the self-contained H2 test slice
payment.kafka.topics-enabled=false
payment.outbox.relay.enabled=false
