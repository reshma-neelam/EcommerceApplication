spring.application.name=PaymentProcessor
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8083}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=INFO

# JWT validation (must match UserManagement issuer + secret)
security.jwt.secret=${JWT_SECRET:local-dev-only-insecure-secret-change-me-32bytes-min}
security.jwt.issuer=${JWT_ISSUER:user-management}

# Order Processor internal client
payment.order.base-url=${ORDER_PROCESSOR_URL:http://localhost:8082}
payment.order.connect-timeout-ms=${ORDER_CONNECT_TIMEOUT_MS:2000}
payment.order.read-timeout-ms=${ORDER_READ_TIMEOUT_MS:3000}

# Stripe (TEST MODE ONLY - never commit real keys)
payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_test_placeholder}
payment.currency=${PAYMENT_CURRENCY:INR}

# Kafka producer (bootstrap set per profile)
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic + relay wiring
payment.kafka.payment-events-topic=${PAYMENT_EVENTS_TOPIC:payment-events}
payment.kafka.topics-enabled=${PAYMENT_KAFKA_TOPICS_ENABLED:true}
payment.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
payment.outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_MS:2000}
payment.outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
payment.outbox.relay.max-retries=${OUTBOX_RELAY_MAX_RETRIES:10}
