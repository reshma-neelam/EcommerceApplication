# Manual/demo profile: in-memory H2 so the REST APIs can be exercised without
# MySQL or Docker. Schema is created from the JPA entities (Flyway is MySQL-only).
spring.datasource.url=jdbc:h2:mem:productcatalog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Browse data at http://localhost:8080/h2-console (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true
