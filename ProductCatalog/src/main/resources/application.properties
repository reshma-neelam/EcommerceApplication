spring.application.name=ProductCatalog

# --- Database placeholders (configure actual values or env vars) ---
# Default to MySQL on localhost; override with env vars as needed
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productcatalog}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# Optional: uncomment to force dialect (Spring Boot usually auto-detects)
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
