spring.application.name=ProductCatalog
# Default profile is local; override with SPRING_PROFILES_ACTIVE (e.g. docker, test)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA & Hibernate settings (schema owned by Flyway; Hibernate only validates)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator: expose health (with liveness/readiness probes) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logging: quiet by default; raise per-profile or via env when debugging
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=INFO
