# Test profile: fully self-contained, in-memory H2 (MySQL compatibility mode).
# The default `mvn test` run must never contact a local MySQL, Kafka, or Stripe.
spring.datasource.url=jdbc:h2:mem:productcatalog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 owns the schema in tests; Flyway (MySQL-specific) stays off here.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
