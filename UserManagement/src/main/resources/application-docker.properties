spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:user_management_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:user_management}
spring.datasource.password=${DB_PASSWORD:user_management}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Service discovery reachable via the docker network service name
eureka.client.service-url.defaultZone=${EUREKA_URL:http://service-discovery:8761/eureka/}
