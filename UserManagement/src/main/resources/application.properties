spring.application.name=UserManagement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8081}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logging: quiet by default
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=INFO

# Security / JWT
security.jwt.secret=${JWT_SECRET:local-dev-only-insecure-secret-change-me-32bytes-min}
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
security.jwt.issuer=${JWT_ISSUER:user-management}
security.refresh.ttl-days=${REFRESH_TTL_DAYS:30}

# Development-only ADMIN bootstrap (disabled unless enabled + email/password set)
security.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
security.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
security.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
