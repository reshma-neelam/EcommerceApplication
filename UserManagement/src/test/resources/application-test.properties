spring.datasource.url=jdbc:h2:mem:usermanagement;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false
spring.sql.init.mode=always

security.jwt.secret=test-only-secret-that-is-at-least-32-bytes-long-1234567890
security.jwt.access-token-ttl-seconds=900
security.jwt.issuer=user-management-test
security.refresh.ttl-days=30
security.admin-bootstrap.enabled=false
