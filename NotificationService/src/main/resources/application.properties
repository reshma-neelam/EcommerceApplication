spring.application.name=NotificationService
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8084}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.root=INFO

# Kafka consumer (String value = JSON EventEnvelope)
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

notification.kafka.order-events-topic=${ORDER_EVENTS_TOPIC:order-events}
notification.kafka.payment-events-topic=${PAYMENT_EVENTS_TOPIC:payment-events}
notification.kafka.consumer-enabled=${NOTIFICATION_KAFKA_CONSUMER_ENABLED:true}

# Email (disabled by default -> log-only sender; no SMTP creds needed for tests/dev)
notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:false}
notification.mail.from=${NOTIFICATION_MAIL_FROM:no-reply@ecommerce.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
